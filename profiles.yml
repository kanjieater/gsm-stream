audio:
  beginning_offset: -5.0
  ffmpeg_reencode_options: '-c:a {encoder} -f {format} -af "afade=t=in:d=0.005"'

vad:
  whisper_model: turbo
  trim_beginning: true
  beginning_offset: -0.3
  short_text_ratio: 0

anki:
  field_options:
    sentence:
      overwrite: false
  fields:
    picture: Image
    sentence: Expression
    sentence_audio: Audio
    word: Vocab
  note_type: Japanese
  show_update_confirmation_dialog_v2: false
  url: http://<anki-connect-host>:8765

defaults:
  text_processing:
    remove_non_japanese: true
  ui:
    adjustTimerOnAfk: true
    afkTimer: 120
    allowNewLineDuringPause: true
    allowPasteDuringPause: true
    autoStartTimerDuringPause: true
    autoStartTimerDuringPausePaste: true
    autoTranslateLines: false
    continuousReconnect: true
    customCSS: |
      input[placeholder="TL"] { display: none !important; }
    enableExternalClipboardMonitor: true
    enableLineAnimation: true
    enablePaste: true
    filterNonCJKLines: false
    fontSize: 24
    maxLines: 1000000
    persistLines: true
    persistStats: true
    preventGlobalDuplicate: true
    showAudioButton: false
    showCharacterCount: true
    showLineCount: true
    showPresetQuickSwitch: true
    showSpeed: true
    showTimer: true
    theme: business
    trimAudioWithVAD: true
    websocketUrl: wss://<your-gsm-domain>/ws/texthooker

profiles: []

# Per-game server-side OCR noise filter.
# ocr_strip is a Python regex applied to every OCR line before it reaches GSM stats.
# The match is replaced with "" and the result is stripped. Affects character count.
#
# Example:
# game_overrides:
#   'My Game Title':
#     ocr_strip: "some noise pattern$"
game_overrides:
  'Hiiro no Kakera Tamayori-hime Kitan: Omoi Iro no Kioku':
    # Read/skip/auto indicators; do not remove 既/強/自/白 inside dialogue.
    ocr_strip: '(?m)(?:既読早送り|[既強][既強自白\s]+|(?<=[。！？」』])既|^[^\S\r\n]*既)(?:\s*【)?\s*\Z|^[^\S\r\n]*(?:既読早送り|強制早送り|自動送り|[既強自])[^\S\r\n]*(?:\r?\n|$)'
  'Hakuoki: Chronicles of Wind and Blossom':
    # Standalone read-indicator lines only; preserve 既/読 inside dialogue.
    ocr_strip: '(?m)^[^\S\r\n]*(?:既[^\S\r\n]*読|既|読)(?:[^\S\r\n]*[◆◇][^\S\r\n]*きどく)?[^\S\r\n]*(?:\r?\n|$)'
